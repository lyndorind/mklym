name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Compute version from tag
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.QUAY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ vars.QUAY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify signature
        env:
          IMAGE_REF: ${{ vars.QUAY_IMAGE }}@${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: >
          cosign verify "$IMAGE_REF"
          --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/docker-publish.yml@.*"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "- Image: ${{ vars.QUAY_IMAGE }}:${{ steps.ver.outputs.version }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
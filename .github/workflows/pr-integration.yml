name: PR Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-integration-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  docker-pr:
    name: docker-pr
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

      - name: Compute temporary tag
        id: vars
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=pr-${PR_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push temporary image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ vars.QUAY_IMAGE }}:${{ steps.vars.outputs.tag }}
          labels: |
            quay.expires-after=7d
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Temporary image"
            echo "- ${{ vars.QUAY_IMAGE }}:${{ steps.vars.outputs.tag }}"
            echo "- Expires automatically after 7 days (quay.expires-after label)"
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration
    needs: docker-pr
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      app:
        image: ${{ vars.QUAY_IMAGE }}:${{ needs.docker-pr.outputs.tag }}
        env:
          POSTGRES_HOST: postgres
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 8000:8000
        options: >-
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Run Postman collection
        run: >
          newman run postman/mklym.postman_collection.json
          --env-var "baseUrl=http://localhost:8000"
          --reporters cli,htmlextra
          --reporter-htmlextra-export newman-report/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: newman-report
          path: newman-report
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -n 40
          done
  
  load-test:
    name: load-test
    needs: docker-pr
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      app:
        image: ${{ vars.QUAY_IMAGE }}:${{ needs.docker-pr.outputs.tag }}
        env:
          POSTGRES_HOST: postgres
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 8000:8000
        options: >-
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"
          exit 1

      - name: Install JMeter
        run: |
          BASE=https://archive.apache.org/dist/jmeter/binaries
          curl -fsSLO "$BASE/apache-jmeter-5.6.3.tgz"
          curl -fsSLO "$BASE/apache-jmeter-5.6.3.tgz.sha512"
          sha512sum -c apache-jmeter-5.6.3.tgz.sha512
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Run JMeter with container monitoring
        run: |
          mkdir -p load-results
          echo "time,container,cpu,memory" > load-results/docker-stats.csv
          (
            while true; do
              ts=$(date +%T)
              docker stats --no-stream --format "{{.Name}},{{.CPUPerc}},{{.MemUsage}}" \
                | sed "s/^/${ts},/" >> load-results/docker-stats.csv
              sleep 2
            done
          ) &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          jmeter -n -t jmeter/mklym-load.jmx \
            -Jhost=localhost -Jport=8000 \
            -Jthreads=20 -Jrampup=10 -Jloops=50 \
            -l load-results/results.jtl \
            -e -o load-results/report

      - name: Check results and summarize
        run: |
          total=$(awk -F, 'NR>1' load-results/results.jtl | wc -l)
          failed=$(awk -F, 'NR>1 && $8=="false"' load-results/results.jtl | wc -l)
          {
            echo "### JMeter"
            echo "- Requests: $total"
            echo "- Failed: $failed"
            echo ""
            echo "### Peak CPU per container"
            echo "| Container | Peak CPU |"
            echo "|---|---|"
            awk -F, 'NR>1 {v=$3; gsub("%","",v); if (v+0>m[$2]) m[$2]=v+0} END {for (k in m) printf "| %s | %.1f%% |\n", k, m[k]}' load-results/docker-stats.csv
          } >> "$GITHUB_STEP_SUMMARY"
          test "$total" -gt 0
          awk -v t="$total" -v f="$failed" 'BEGIN { exit (f/t > 0.01) }'

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: load-test-results
          path: load-results
          if-no-files-found: warn
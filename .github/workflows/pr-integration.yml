name: PR Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-integration-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  docker-pr:
    name: docker-pr
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

      - name: Compute temporary tag
        id: vars
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=pr-${PR_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push temporary image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ vars.QUAY_IMAGE }}:${{ steps.vars.outputs.tag }}
          labels: |
            quay.expires-after=7d
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Temporary image"
            echo "- ${{ vars.QUAY_IMAGE }}:${{ steps.vars.outputs.tag }}"
            echo "- Expires automatically after 7 days (quay.expires-after label)"
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration
    needs: docker-pr
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      app:
        image: ${{ vars.QUAY_IMAGE }}:${{ needs.docker-pr.outputs.tag }}
        env:
          POSTGRES_HOST: postgres
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 8000:8000
        options: >-
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Run Postman collection
        run: >
          newman run postman/mklym.postman_collection.json
          --env-var "baseUrl=http://localhost:8000"
          --reporters cli,htmlextra
          --reporter-htmlextra-export newman-report/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: newman-report
          path: newman-report
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -n 40
          done
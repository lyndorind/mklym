name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Read version from code
        id: ver
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Generate SHA-256 checksum
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) found=1; next }
            found
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No section [${{ steps.ver.outputs.version }}] in CHANGELOG.md"
            exit 1
          fi

      - name: Create tag and release
        uses: ./.github/actions/create-release
        with:
          version: ${{ steps.ver.outputs.version }}
          notes-file: release_notes.md
          assets: dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}